<div class="container">
  <div class="border"></div>
  <div class="hud">
    <div class="chat">
      <ul>
        @for (chat of chatrooms(); track chat._id) {
          <li>
            {{ chat.chatname }}
          </li>
        }
      </ul>
    </div>
    <div class="messages"></div>
  </div>
  <div class="border"></div>
</div>
