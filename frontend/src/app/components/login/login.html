<div>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label for="email">Email</label>
    <input type="text" formControlName="email" id="email" /><br />
    @if (email.invalid && email.touched) {
      @if (email.hasError('required')) {
        <small>El email es obligatorio</small>
      }
      @if (email.hasError('email')) {
        <small>El formato del email es incorrecto</small>
      }
    }
    <label for="password">Contraseña</label>
    <input type="password" formControlName="password" id="password" /><br />
    @if (password.invalid && password.touched) {
      <small>La contraseña es obligatoria</small>
    }
    <button type="submit" [disabled]="loginForm.invalid">Enviar</button>
  </form>
</div>
